name: Build APK - ReplayX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restaurar keystore de release
        env:
          RX_KEYSTORE_B64: ${{ secrets.RX_KEYSTORE_B64 }}
        run: |
          if [ -n "$RX_KEYSTORE_B64" ]; then
            echo "$RX_KEYSTORE_B64" | base64 -d > app/replayx-release.jks
            echo "Keystore restaurada."
          else
            echo "Sem RX_KEYSTORE_B64 configurada — build sai sem assinatura de release."
          fi

      - name: Build APK (release)
        env:
          RX_KEYSTORE_PATH: ${{ secrets.RX_KEYSTORE_B64 && 'replayx-release.jks' || '' }}
          RX_KEYSTORE_PASSWORD: ${{ secrets.RX_KEYSTORE_PASSWORD }}
          RX_KEY_ALIAS: ${{ secrets.RX_KEY_ALIAS }}
          RX_KEY_PASSWORD: ${{ secrets.RX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReplayX-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
